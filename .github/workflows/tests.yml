name: Tests
on:
  push:
  pull_request:
  workflow_dispatch:
defaults:
  run:
    shell: bash  # bash -eo pipefail: a failing check piped into tee fails the step

permissions:
  contents: read
jobs:
  scripts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: apply.sh + latest-tag.sh
        run: tests/test-scripts.sh
      - name: check-apk.sh
        run: tests/test-check-apk.sh
      - name: check-deps.sh
        run: tests/test-check-deps.sh
