name: Upstream watch
# Daily: if CoMaps has a newer Android release than BASE, re-apply patches/ on it and build a release.
# Patch already in upstream -> dropped (commit + issue). Patch that no longer applies -> issue, no build.
on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Only report what would happen (no commit, no build)"
        type: boolean
        default: true
      tag:
        description: "Try this upstream tag even if it is not newer than BASE (tests)"
        required: false
        default: ""

defaults:
  run:
    shell: bash  # bash -eo pipefail: a failing check piped into tee fails the step

permissions:
  contents: write
  issues: write
  actions: write

concurrency:
  group: ourmaps-watch
  cancel-in-progress: false

env:
  UPSTREAM: https://codeberg.org/comaps/comaps.git

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      build: ${{ steps.result.outputs.build }}
      tag: ${{ steps.find.outputs.tag }}
      sha: ${{ steps.result.outputs.sha }}
      merged: ${{ steps.result.outputs.merged }}
    steps:
      - uses: actions/checkout@v5
        with:
          path: fork

      - name: Find newest upstream release
        id: find
        run: |
          base=$(tr -d ' \n' < fork/BASE)
          tag="${{ inputs.tag }}"
          if [ -z "$tag" ]; then
            tag=$(fork/scripts/latest-tag.sh "$UPSTREAM")
            [ -n "$tag" ] || { echo "::error::no upstream Android release tag found"; exit 1; }
            newest=$(printf '%s\n%s\n' "$base" "$tag" | sort -V | tail -1)
            if [ "$tag" = "$base" ] || [ "$newest" = "$base" ]; then
              echo "BASE $base is the newest upstream release ($tag): nothing to do." | tee -a "$GITHUB_STEP_SUMMARY"
              echo "todo=false" >> "$GITHUB_OUTPUT"; exit 0
            fi
          fi
          echo "BASE $base, trying $tag" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"; echo "base=$base" >> "$GITHUB_OUTPUT"; echo "todo=true" >> "$GITHUB_OUTPUT"

      - name: Try the patches
        id: apply
        if: steps.find.outputs.todo == 'true'
        run: |
          git clone --depth 1 --branch "${{ steps.find.outputs.tag }}" "$UPSTREAM" up
          set +e
          fork/scripts/apply.sh up fork/patches report.md; rc=$?
          set -e
          cat report.md; { echo; cat report.md; } >> "$GITHUB_STEP_SUMMARY"
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          [ $rc -eq 0 ] || [ $rc -eq 2 ] || exit 1

      - name: Open conflict issue
        if: steps.apply.outcome == 'success' && steps.apply.outputs.rc == '2'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.find.outputs.tag }}
          DRY: ${{ inputs.dry_run }}
        working-directory: fork
        run: |
          title="Rebase conflict on upstream $TAG"
          {
            echo "A patch no longer applies on CoMaps \`$TAG\`. Nothing was built and BASE stays \`${{ steps.find.outputs.base }}\`."
            echo
            cat ../report.md
            echo
            echo "Hand fix:"
            echo "1. Clone upstream at \`$TAG\`, \`git am\` the patches in order, resolve the failing one, \`git format-patch\` it back into \`patches/\` under the same file name."
            echo "2. If upstream merged this fix in a reworded form (forward and reverse both fail), delete the patch instead."
            echo "3. Push to main, then run *Upstream watch* again (dry_run off)."
          } > ../issue.md
          if [ "$DRY" = "true" ] && [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            title="[dry run] $title"
          fi
          gh label create rebase-conflict --color B60205 --description "A patch does not apply on a new upstream release" 2>/dev/null || true
          if [ -n "$(gh issue list --state open --label rebase-conflict --search "\"$title\" in:title" --json number -q '.[].number')" ]; then
            echo "Issue already open: $title"
          else
            gh issue create --title "$title" --label rebase-conflict --body-file ../issue.md
          fi
          exit 1

      - name: Prepare BASE bump on a branch (main moves only after a green build)
        id: result
        if: steps.apply.outcome == 'success' && steps.apply.outputs.rc == '0'
        env:
          TAG: ${{ steps.find.outputs.tag }}
          DRY: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        working-directory: fork
        run: |
          [ -n "$TAG" ] || { echo "::error::no tag to move to"; exit 1; }
          merged=$(sed -n 's/^MERGED   //p' ../report.md | tr '\n' ' ' | sed 's/ *$//')
          if [ "$DRY" = "true" ]; then
            echo "Dry run: would set BASE to $TAG, drop: ${merged:-none}, then build." | tee -a "$GITHUB_STEP_SUMMARY"
            echo "build=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          git config user.name "ourmaps-ci"; git config user.email "ourmaps-ci@users.noreply.github.com"
          for p in $merged; do git rm -q "patches/$p"; done
          echo "$TAG" > BASE
          {
            echo "## $TAG ($(date -u +%F))"; echo
            echo "- BASE ${{ steps.find.outputs.base }} -> $TAG (upstream watch)."
            [ -z "$merged" ] || echo "- Dropped (merged upstream): ${merged// /, }."
            echo
          } > ../entry.md
          awk -v f=../entry.md 'NR==1{print; print ""; while((getline l < f)>0) print l; next} {print}' CHANGELOG.md > ../cl.md && mv ../cl.md CHANGELOG.md
          git add -A BASE CHANGELOG.md patches
          git commit -qm "Upstream $TAG: BASE bump${merged:+, drop merged patches}"
          # Scratch branch, rewritten by each retry; main is only fast-forwarded by the promote job.
          git push -f origin "HEAD:refs/heads/watch/$TAG"
          { echo "build=true"; echo "sha=$(git rev-parse HEAD)"; echo "merged=$merged"; } >> "$GITHUB_OUTPUT"

      - name: Keepalive commit after 45 quiet days
        # GitHub disables scheduled workflows after 60 days without repo activity (ada #11541).
        if: always() && github.event_name == 'schedule'
        working-directory: fork
        run: |
          git fetch -q origin main
          last=$(git log -1 --format=%ct origin/main); now=$(date +%s)
          if [ $(( (now - last) / 86400 )) -ge 45 ]; then
            git config user.name "ourmaps-ci"; git config user.email "ourmaps-ci@users.noreply.github.com"
            git checkout -q origin/main && date -u +%F > KEEPALIVE && git add KEEPALIVE
            git commit -qm "keepalive: upstream watch still running" && git push origin HEAD:main
            echo "keepalive commit pushed" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Keep the schedule alive
        # GitHub disables scheduled workflows after 60 days without repo activity; re-enable on every run.
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X PUT "repos/${{ github.repository }}/actions/workflows/upstream-watch.yml/enable" && echo "schedule re-enabled $(date -u +%F)" | tee -a "$GITHUB_STEP_SUMMARY" || echo "::warning::could not re-enable the schedule"

  build:
    needs: watch
    if: needs.watch.outputs.build == 'true'
    uses: ./.github/workflows/release.yml
    with:
      upstream_tag: ${{ needs.watch.outputs.tag }}
      fork_ref: ${{ needs.watch.outputs.sha }}
      publish: true
    secrets: inherit
    permissions:
      contents: write

  promote:
    needs: [watch, build]
    if: needs.build.result == 'success'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.watch.outputs.tag }}
      SHA: ${{ needs.watch.outputs.sha }}
      MERGED: ${{ needs.watch.outputs.merged }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ needs.watch.outputs.sha }}
      - name: Fast-forward main to the built commit
        run: |
          git fetch -q origin main
          if ! git merge-base --is-ancestor origin/main "$SHA"; then
            echo "::error::main moved during the build; merge watch/$TAG into main by hand"; exit 1
          fi
          git push origin "$SHA:refs/heads/main"
          git push origin --delete "watch/$TAG" || true
          if [ -n "$MERGED" ]; then
            gh label create upstream-merged --color 0E8A16 --description "A fix of ours is now in CoMaps" 2>/dev/null || true
            gh issue create --title "Upstream $TAG merged: ${MERGED// /, }" --label upstream-merged \
              --body "CoMaps \`$TAG\` already contains these patches, so they were removed from \`patches/\`: $MERGED"
          fi

  build-failed:
    needs: [watch, build, promote]
    if: always() && needs.watch.outputs.build == 'true' && (needs.build.result != 'success' || needs.promote.result != 'success')
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.watch.outputs.tag }}
    steps:
      - name: Open build-failed issue
        run: |
          title="Build failed on upstream $TAG"
          gh label create build-failed --repo "${{ github.repository }}" --color D93F0B --description "Upstream watch could not build or promote a new release" 2>/dev/null || true
          if [ -n "$(gh issue list --repo "${{ github.repository }}" --state open --label build-failed --search "\"$title\" in:title" --json number -q '.[].number')" ]; then
            echo "Issue already open: $title"; exit 0
          fi
          gh issue create --repo "${{ github.repository }}" --title "$title" --label build-failed --body \
            "Patches applied on CoMaps \`$TAG\`, but build=${{ needs.build.result }}, promote=${{ needs.promote.result }}. BASE on main is unchanged, so tomorrow's run tries again. Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }} (branch watch/$TAG)."
